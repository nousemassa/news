# Правила линтера проекта `news`. Файл свой, а не ссылка на уровень выше: у отдельного репозитория
# родительского конфига нет, и ruff искал бы настройки ВВЕРХ, взяв умолчания (другая длина строки,
# другой набор правил — `B008` вдруг стал бы нарушением).
line-length = 110
target-version = "py311"

[lint]
#: B008 (вызов функции в значении по умолчанию) — это идиома FastAPI: `File(...)`, `Depends(...)`,
#: `Query(...)` в сигнатуре и есть способ объявить параметр. Правило здесь даёт ложное срабатывание.
ignore = ["B008"]

[lint.isort]
#: Свой код: общий слой и пакет проекта. Иначе линтер считал бы установленный `agent_core` сторонним
#: пакетом и требовал отделять его пустой строкой.
known-first-party = ["agent_core", "news_agent"]
