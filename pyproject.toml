[project]
name = "news-agent"
version = "0.1.0"
description = "Новостной контур: бот канала, разбор ленты, команда ролей на LangGraph"
requires-python = ">=3.11"
dependencies = [
    #: Общий слой — своя распространяемая единица, ставится колёсом из `wheels/`. Версия ТОЧНАЯ: образ
    #: собирается офлайн (`--no-index`), поэтому расхождение с лежащим в репозитории колесом ломает
    #: сборку сразу, а не откладывается до прода.
    "agent-core==0.18.0",
    # HTTP-процесс новостей
    # Нижняя граница поднята осознанно: встроенная телеметрия FastAPI настраивается
    # через `FastAPI(telemetry=…)` (её читает `agent_core.telemetry.fastapi_telemetry`).
    # На 0.115 этого аргумента нет ⇒ пуск упал бы `TypeError`.
    "fastapi>=0.143",
    "uvicorn[standard]>=0.30",
    # обращения к платформе и к нашему поиску
    "httpx>=0.27",
    # модели-схемы новостного контура
    "pydantic>=2.8",
    # MCP-клиент (наш поиск `mcp-searxng`) — своя сессия на выпуск
    "fastmcp>=4.1",
    # новостная команда ролей — граф; чекпойнтер в памяти, Postgres-вариант ей НЕ нужен
    "langgraph>=1.2",
    # Telegram: транспорт MTProto (механика в общем слое, но тип клиента здесь тоже виден)
    "telethon>=1.45",
    #: ❗ `PyYAML` объявлен явно, хотя импортируется лениво (`decisions/report.py`, тесты): как
    #: транзитивная зависимость он был бы латентной поломкой — пропадёт чужой пин, и импорт сломается
    #: без единой нашей правки.
    "PyYAML>=6.0",
]

[project.optional-dependencies]
#: Окружение проверок (`make test`/`make ci`): без него отдельный репозиторий не на чем гонять.
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["news_agent*"]

[tool.pytest.ini_options]
#: ❗ Обязательно в СВОЁМ файле: настроек воркспейса рядом может не быть, а без `auto` падают ВСЕ
#: асинхронные тесты (их большинство), причём ошибкой, которая выглядит как «тесты сломались»,
#: а не «конфигурация уехала».
asyncio_mode = "auto"
#: Маркер объявлен здесь же: цель `ci` зовёт `pytest -m "not live"`, и незарегистрированный маркер
#: давал бы предупреждение на каждом прогоне.
markers = ["live: требует поднятый стенд и настоящие токены (пока не используется: живые тесты пропускает фикстура)"]
