# Проект `news`: бот канала новостей и его процесс. Своя папка, свой композ, своё имя проекта compose
# (`news`) и своя сеть платформы — её имя приходит настройкой `PLATFORM_NETWORK`.
#
# **Почему отдельный проект.** У новостного контура своя жизнь: свой выпуск, свой граф ролей, своя сессия
# Telegram и свой темп правок. Своё имя проекта compose — это своя единица управления (метки, «сироты»,
# пересоздание), отдельная от чужого кода.

name: news

networks:
  # Сеть ОБЩАЯ, а не наша: создаёт её стек платформы, мы только подключаемся (`external: true`).
  #: ❗ Имя задаётся настройкой и обязательно — умолчания нет. С умолчанием композ молча взял бы сеть,
  #: случайно совпавшую по имени, и службы не увидели бы ни базу, ни мост: отказ был бы тихим.
  platform:
    external: true
    name: ${PLATFORM_NETWORK:?задайте PLATFORM_NETWORK в .env проекта}

volumes:
  #: База САМОГО продукта: свой экземпляр, своё имя тома. У каждого контура свой postgres, поэтому откат
  #: или пересоздание стека соседа не задевает данные.
  news-db-data:
    name: news-db-data

services:
  # БАЗА ПРОДУКТА: свой экземпляр `postgres:17`, только база `news`.
  #
  # ❗ Пароль — ОБЯЗАТЕЛЬНАЯ подстановка (`:?`): при пустой переменной образ не стартует вовсе, и цикл
  # рестарта был бы неотличим от «база медленно поднимается».
  news-db:
    image: postgres:17
    container_name: news-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: news
      POSTGRES_DB: news
      POSTGRES_PASSWORD: ${NEWS_DB_PASSWORD:?NEWS_DB_PASSWORD не задан в .env продукта}
    volumes:
      - news-db-data:/var/lib/postgresql/data
    #: Сеть — та же общая, что у остальных служб композа: база обязана быть видна им по имени службы.
    networks: [platform]
    ports:
      - "127.0.0.1:55436:5432"
    mem_limit: 512m
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}
    healthcheck:
      #: ❗ `pg_isready` НЕГОДЕН: он отвечает 0 и при отсутствующей базе. Спрашиваем саму базу.
      test: ["CMD-SHELL", "psql -U news -d news -tAc 'select 1' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # НАКАТ НОВОСТНОЙ СХЕМЫ: одноразовая служба, отдельная от процесса бота.
  #
  # ❗ Новости накатывают ТОЛЬКО свою схему: векторная база им не принадлежит, и её недоступность
  # накату не мешает — новости работают без RAG.
  # ❗ `restart: "no"` — потому что служба одноразовая: она обязана закончиться один раз и с кодом 0,
  # и именно этого ждёт `depends_on: service_completed_successfully` у бота. Перезапуск по кругу
  # означал бы, что бот ждёт вечно, а настоящая причина отказа тонет в цикле рестартов.
  #: ❗ `image:` задан ЯВНО и тот же, что у бота: иначе compose тегирует образ именем службы, накат и
  #: бот собираются дважды и могут разъехаться — схема накатана одной сборкой, а бот поднят другой.
  #: Приёмка — совпадение образа, а не «healthy».
  migrate:
    image: news-agent:latest
    restart: "no"
    depends_on:
      news-db:
        condition: service_healthy
    env_file:
      #: ❗ Свой `.env` ОБЯЗАН существовать (гейт в лончере), но необязателен для РАЗБОРА композа:
      #: `make check` и CI проверяют разбор, не имея секретов.
      #: Общая основа воркспейса — ПЕРВОЙ и необязательной: в ней ключи, которые нужны службе,
      #: но принадлежат не только ей (доступ к платформе, Telegram, LLM, подпись кнопок).
      #: Нет файла — контейнер поднимется на своём `.env`: законный одиночный клон.
      - path: ../.env
        required: false
      - path: ./.env
        required: false
    environment:
      #: Адрес базы (логин и пароль — свои у каждой базы) приходит из `.env` проекта.
      VECTOR_DB_URL: postgresql+asyncpg://username:${VECTOR_DB_PASSWORD:?VECTOR_DB_PASSWORD не задан}@pgvector:5432/vectors
    networks: [platform]
    command: ["python", "-m", "news_agent.db.migrate", "--components", "core,news", "--wait", "180"]

  news:
    #: ❗ Один образ на проект: и бот, и накат собираются из одного Dockerfile, поэтому имя образа
    #: задано явно. Иначе compose тегирует образ именем службы (`news-news`) и у наката оказывается
    #: своя сборка.
    image: news-agent:latest
    #: ❗ Имя контейнера задано ЯВНО и совпадает с именем службы — иначе при `name: news` compose даёт
    #: `news-news-1` (проект и служба начинаются одним словом, и имя ничего не сообщает).
    container_name: news
    depends_on:
      migrate:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # ❗ Время на штатное завершение. По умолчанию docker даёт 10 с и добивает SIGKILL, а выпуск
    # новостей идёт 65–95 с, ход диалога ждёт до 240 с. SIGKILL обрывает `atexit`-досылку спанов
    # (дерево в приёмнике обрезается — то есть ложные доказательства) и теряет запись о деньгах.
    # 300 с дают процессу свернуться самому; переключатель гасит службу именно этим `stop`.
    stop_grace_period: 300s
    #: ❗ Окружение проекта — файлом рядом с композом (тот же `./.env`, что и у наката: одна база, одни
    #: ключи). Значения ниже (адреса и каталог сессий) задаются ЯВНО и перекрывают его: внутри
    #: контейнера `127.0.0.1` и контейнерные имена ведут себя иначе, чем на хосте, и «удобное
    #: умолчание» здесь уже давало молчаливый отказ.
    #: `required: false` — по той же причине, что у наката: разбор композа не должен требовать секретов.
    env_file:
      #: Общая основа воркспейса — ПЕРВОЙ и необязательной: в ней ключи, которые нужны службе,
      #: но принадлежат не только ей (доступ к платформе, Telegram, LLM, подпись кнопок).
      #: Нет файла — контейнер поднимется на своём `.env`: законный одиночный клон.
      - path: ../.env
        required: false
      - path: ./.env
        required: false
    environment:
      #: Адрес базы (логин и пароль — свои у каждой базы) приходит из `.env` проекта.
      VECTOR_DB_URL: postgresql+asyncpg://username:${VECTOR_DB_PASSWORD:?VECTOR_DB_PASSWORD не задан}@pgvector:5432/vectors
      # Платформа и трассировка живут ВНЕ нашей сети ⇒ только через docker-шлюз (`extra_hosts` ниже).
      #: ❗ Ручка алертов МОСТА — последний рубеж в `_alert_bridge`: если и чат не отвечает, бот скажет
      #: о своей ошибке тем же каналом, каким шлют сторожа. Адрес задан ЯВНО (имя службы в общей сети):
      #: внутри контейнера `127.0.0.1` — это он сам.
      BRIDGE_ALERT_URL: http://bridge:8081
      PLATFORM_API_URL: http://host.docker.internal:8680/api
      OTEL_ENDPOINT: http://host.docker.internal:8680/api/otlp/v1/traces
      # ❗ Приёмник трассировки: адрес ЯВНО на хост-шлюз. В `.env` он ХОСТОВЫЙ (127.0.0.1), а внутри
      # контейнера 127.0.0.1 — сам контейнер: без этой строки спаны уходили бы «в себя» МОЛЧА.
      # Порт 4318 опубликован на 0.0.0.0 именно поэтому (loopback из контейнера недостижим).
      TELEMETRY_OTLP_ENDPOINT: http://host.docker.internal:4318/v1/traces
      # Адреса сервисов моделей приходят из `.env` агента: в бою службы могут стоять на разных хостах,
      # поэтому композ их только ПЕРЕДАЁТ. Обязательная подстановка делает пропуск громким.
      LLAMA_EMBED_URL: ${LLAMA_EMBED_URL:?LLAMA_EMBED_URL не задан в .env агента}
      SOLVER_URL: ${SOLVER_URL:?SOLVER_URL не задан в .env агента}
      #: ❗ Каталог файлов-сессий задаётся явно: он НЕ выводится из расположения кода (общий слой живёт
      #: в `site-packages`), а неверный путь означает, что бот молча не подключится.
      SESSIONS_DIR: /srv/news/.sessions
    networks: [platform]
    user: "1000:1000"
    volumes:
      #: Свой каталог сессий у проекта (файл `news.session` — ключ доступа бота, режим 0600, вне git).
      - ./.sessions:/srv/news/.sessions
    ports:
      # Потребитель один — сторож службы на хосте, поэтому только loopback.
      - "127.0.0.1:8086:8086"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Лимит по ЗАМЕРУ: пик cgroup процесса новостей — 80 МиБ, запас ×6.
    mem_limit: 512m
    command: ["uvicorn", "news_agent.news_main:app", "--host", "0.0.0.0", "--port", "8086", "--no-access-log"]
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://127.0.0.1:8086/health', timeout=5).status_code==200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s
